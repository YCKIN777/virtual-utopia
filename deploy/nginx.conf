# 虚拟乌托邦 全栈入口反代与静态托管（nginx）
# 路由约定（对齐 P5.4-⑯ shell 下线：唯一入口为 3D 世界）：
#   /           → 3D 世界（frontend/src/virtual-utopia/dist）【根入口】
#   /admin/     → 管理后台（frontend/src/phase6/dist）
#   /api/       → scene 后端（3000）
#   /phase6-api/→ phase6 网关（3400，登录/认证代理）
#   说明：外层壳 /shell 已随 P5.4-⑯ 下线；如需回退，取消注释 shell location 并改回 root。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html/world;
    index index.html;

    # 3D 世界 AI 对话（sceneClient 走 /scene-api 同源代理，SSE 长连接）
    location /scene-api/ {
        proxy_pass http://scene:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE（stream 端点长连接）
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # scene 后端（含 /api/scene/route/stream 等）
    location /api/ {
        proxy_pass http://scene:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE（stream 端点长连接）
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # phase6 网关（登录/认证/业务）
    location /phase6-api/ {
        proxy_pass http://phase6:3400/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 管理后台
    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    # 3D 世界（hash 路由，history fallback 到其 index.html）——根入口
    location / {
        try_files $uri $uri/ /index.html;
    }
}
