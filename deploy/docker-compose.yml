# 虚拟乌托邦 全栈编排（P5.3-⑩ 模板 · P5.4-⑯ 对齐：shell 下线、唯一入口 3D 世界）
#
# 说明：
#   - Docker 实测完成（本机 Docker Desktop 4.84+ / WSL2）；服务：chroma(8000) + phase5(3300)
#     + phase6(3400) + scene(3000) + frontend-nginx(80)。frontend 根入口为 3D 世界（world），
#     管理后台走 /admin/（shell 已下线，nginx.conf 注释保留回退方法）。
#   - scene 真实密钥经 env_file 注入（../backend/.env：DEEPSEEK_API_KEY / LANGCHAIN 三行 /
#     AI_* 配置），.env 在 gitignore 中不入库。
#   - 数据卷持久化：phase5/6 业务库与 scene 运行库（backend/data）、chroma 向量数据。
#   - 生产必改：change-me 占位（PHASE5_AUTH_SECRET / PHASE5_SERVICE_TOKEN）、chroma AUTH。
#
# 用法：
#   docker compose -f deploy/docker-compose.yml up -d --build
#   docker compose -f deploy/docker-compose.yml ps
#   docker compose -f deploy/docker-compose.yml logs -f scene
#   停止/清理：docker compose -f deploy/docker-compose.yml down [-v]
services:
  chroma:
    image: chromadb/chroma:1.5.9
    container_name: virtual-utopia-chroma
    restart: unless-stopped
    # P5.6-1 生产安全加固：chroma 1.0+ 已移除内置鉴权（legacy auth 变量无效）。
    # 采用「不暴露」策略：移除宿主端口映射，仅容器内网可达（scene 经 http://chroma:8000），
    # 宿主/公网均无法直连。需要本地直连 chroma 时临时 docker run -p 8000:8000 映射即可。
    # ports:
    #   - "8000:8000"
    volumes:
      - chroma-data:/data
    environment:
      ANONYMIZED_TELEMETRY: "False"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8000/api/v2/heartbeat"]
      interval: 10s
      timeout: 3s
      retries: 5

  phase5:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    image: virtual-utopia-backend
    container_name: virtual-utopia-phase5
    restart: unless-stopped
    command: ["node", "backend/src/phase5/server.js"]
    # P5.6-1 生产收敛：移除宿主端口映射，仅容器内网可达（phase6 经 http://phase5:3300、nginx 同域反代）。
    # 本地直连调试时临时取消注释即可。
    # ports:
    #   - "3300:3300"
    environment:
      PHASE5_HOST: "0.0.0.0"
      # 生产必改：在 deploy/.env 或宿主环境注入 PHASE5_AUTH_SECRET / PHASE5_SERVICE_TOKEN
      PHASE5_AUTH_SECRET: "${PHASE5_AUTH_SECRET:-change-me-please}"
      PHASE5_SERVICE_TOKEN: "${PHASE5_SERVICE_TOKEN:-change-me-please}"
      PHASE5_BOOTSTRAP_ADMIN_USERNAME: "admin"
      # 实测沿用本地 start-all 默认（admin/utopia2026）；生产必改
      PHASE5_BOOTSTRAP_ADMIN_PASSWORD: "${PHASE5_BOOTSTRAP_ADMIN_PASSWORD:-utopia2026}"
      PHASE5_DB_PATH: "/data/phase5/virtual_utopia_phase5.sqlite"
      PHASE5_ENABLED: "true"
    volumes:
      - phase5-data:/data/phase5
    depends_on:
      - chroma

  phase6:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    image: virtual-utopia-backend
    container_name: virtual-utopia-phase6
    restart: unless-stopped
    command: ["node", "backend/src/phase6/server.js"]
    # P5.6-1 生产收敛：移除宿主端口映射，仅容器内网可达（nginx 同域反代 /phase6-api -> phase6:3400）。
    # ports:
    #   - "3400:3400"
    environment:
      PHASE6_HOST: "0.0.0.0"
      PHASE5_SERVICE_TOKEN: "${PHASE5_SERVICE_TOKEN:-change-me-please}"
      PHASE5_BASE_URL: "http://phase5:3300"
      # P5.6-1 上线适配：CORS 白名单（逗号分隔；公网隧道域名变更时改 deploy/.env 或此默认）
      PHASE6_ALLOWED_ORIGINS: "${PHASE6_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174,http://localhost:5175,https://36087f0f.r2.cpolar.top}"
      # phase6 业务库统一放 /data/phase6（可用 PHASE6_*_DB_PATH 逐一覆盖，默认相对 backend 目录）
    volumes:
      - phase6-data:/data/phase6
    depends_on:
      - phase5

  scene:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    image: virtual-utopia-backend
    container_name: virtual-utopia-scene
    restart: unless-stopped
    command: ["node", "backend/src/server.js"]
    # P5.6-1 生产收敛：移除宿主端口映射，仅容器内网可达（nginx 同域反代 /scene-api -> scene:3000）。
    # ports:
    #   - "3000:3000"
    # 真实密钥经 env_file 注入（DEEPSEEK_API_KEY / LANGCHAIN 三行 / AI_* 配置），
    # .env 在 gitignore 中不入库；Docker 实测时直接复用本机 backend/.env。
    env_file:
      - ../backend/.env
    environment:
      # 容器内服务发现：覆盖 backend/.env 里 localhost 默认值
      PHASE6_BASE_URL: "http://phase6:3400"
      CHROMA_URL: "http://chroma:8000"
      CHROMA_COLLECTION: "virtual_utopia_rag"
    volumes:
      - scene-data:/app/backend/data
    depends_on:
      - phase6
      - chroma

  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
      args:
        VITE_PHASE6_API_BASE_URL: "/phase6-api"
    image: virtual-utopia-frontend
    container_name: virtual-utopia-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - scene
      - phase6

volumes:
  chroma-data:
  phase5-data:
  phase6-data:
  scene-data:
